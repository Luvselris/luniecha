<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>luniecha ♡</title>

  <!-- Open Graph สำหรับ LINE Preview -->
  <meta property="og:title" content="luniecha ♡">
  <meta property="og:description" content="ยินดีต้อนรับเข้าสู่ร้าน luniecha ♡ ร้านเราเปิด 24 ชั่วโมง พร้อมตอบตลอดนะคะ">
  <meta property="og:url" content="https://luniecha.netlify.app">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-pink: #ffeef2;
      --card-white: #ffffff;
      --pink-main: #ff7597;
      --pink-border: #ffd3de;
      --pink-soft: #fff5f7;
      --text-dark: #4a3e3d;
      --text-sub: #8c7a7d;
      --shadow: 0 8px 24px rgba(255, 117, 151, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-pink);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 14px 60px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* แถบสลับเมนูด้านบนสุด (Home / contact) */
    .top-navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--pink-border);
      border-radius: 30px;
      padding: 4px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 14px rgba(255, 117, 151, 0.08);
    }

    .nav-tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: #df7b85;
      border-radius: 24px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .nav-tab-btn.active {
      background: #ffffff;
      color: var(--pink-main);
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(255, 117, 151, 0.18);
      border: 1px solid #ffe3e9;
    }

    .tab-section {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 16px;
    }

    .tab-section.active {
      display: flex;
    }

    /* 1. การ์ดร้านค้า */
    .store-card {
      background: var(--card-white);
      border-radius: 28px;
      padding: 14px 14px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--pink-border);
      text-align: center;
    }

    .banner-wrap {
      width: 100%;
      height: 145px;
      border-radius: 20px;
      overflow: hidden;
      background: var(--pink-soft);
    }

    .banner-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-wrap {
      margin-top: -46px;
      display: inline-block;
      position: relative;
    }

    .profile-wrap img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 4px 14px rgba(255, 117, 151, 0.2);
      display: block;
      background: #ffffff;
    }

    .store-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--pink-main);
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .store-bio {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-top: 8px;
      line-height: 1.65;
      white-space: pre-line;
      padding: 0 10px;
    }

    /* 2. การ์ดไฮไลท์ */
    .card-box {
      background: var(--card-white);
      border-radius: 28px;
      padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--pink-border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .box-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--pink-main);
      text-align: center;
    }

    .highlights-wrap {
      display: flex;
      justify-content: center;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .hl-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .hl-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, #ffd3de, var(--pink-main));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(255, 117, 151, 0.2);
    }

    .hl-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #ffffff;
    }

    .hl-label {
      font-size: 11.5px;
      color: var(--text-dark);
      margin-top: 6px;
      text-align: center;
    }

    /* 3. รายการรีวิว */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .review-bubble {
      background: #ffffff;
      border: 1px solid var(--pink-border);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rev-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rev-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .rev-stars {
      color: #ffb703;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .rev-text {
      font-size: 12.5px;
      color: var(--text-dark);
      margin-top: 4px;
      line-height: 1.5;
    }

    .rev-date {
      font-size: 10.5px;
      color: #b09ba0;
      text-align: right;
      margin-top: 4px;
    }

    /* ฟอร์มเขียนรีวิวด้านล่างการ์ด */
    .review-form-divider {
      border-top: 1px dashed var(--pink-border);
      margin: 8px 0;
    }

    .form-stars-select {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: #ffd6df;
      transition: transform 0.15s;
    }

    .star-btn.active {
      color: #ffb703;
      transform: scale(1.1);
    }

    .custom-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--pink-border);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-dark);
      outline: none;
      margin-bottom: 10px;
    }

    .custom-input:focus {
      border-color: var(--pink-main);
    }

    .custom-input::placeholder {
      color: #cbb3b8;
    }

    .btn-submit-review {
      width: 100%;
      background: linear-gradient(135deg, #ffa3ba, var(--pink-main));
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 117, 151, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-submit-review:active {
      transform: scale(0.98);
    }

    /* 4. กล่อง Contact ในแท็บ contact */
    .contact-card-link {
      background: var(--card-white);
      border: 1px solid var(--pink-border);
      border-radius: 22px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: var(--shadow);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .contact-card-link:active {
      transform: scale(0.97);
    }

    .contact-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--pink-main);
    }

    .contact-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Story Modal */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999999;
      flex-direction: column;
      justify-content: space-between;
    }
    .story-modal.active { display: flex; }

    .story-bars {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }

    .story-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      overflow: hidden;
    }

    .story-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    .story-header {
      position: absolute;
      top: 26px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      color: #fff;
    }

    .story-close-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #fff;
      font-size: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .story-image-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
    }

    .story-image {
      width: 100%;
      height: 100%;
      max-height: 94vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .story-tap-left, .story-tap-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 99999;
      cursor: pointer;
    }
    .story-tap-left { left: 0; }
    .story-tap-right { right: 0; }
  </style>
</head>
<body>

  <!-- เพลงพื้นหลัง -->
  <audio id="bgMusic" loop autoplay preload="auto" playsinline src="https://file.garden/asG8Gt-rqWIpi3II/%5BThaisub%20%E0%B8%8B%E0%B8%B1%E0%B8%9A%E0%B9%84%E0%B8%97%E0%B8%A2%5D%20%E8%AF%A5%E6%AD%BB%E7%9A%84%E7%88%B1%E6%83%85%EF%BC%88%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%B1%E0%B8%81%E0%B9%80%E0%B8%AE%E0%B9%87%E0%B8%87%E0%B8%8B%E0%B8%A7%E0%B8%A2%EF%BC%89%E2%80%94%20%E9%98%BF%E6%9F%B4.mp3"></audio>

  <div class="container">

    <!-- แถบเมนูด้านบน 2 แท็บ: Home และ contact -->
    <div class="top-navbar">
      <button type="button" class="nav-tab-btn active" id="btn-home" onclick="switchPage('home')">Home</button>
      <button type="button" class="nav-tab-btn" id="btn-contact" onclick="switchPage('contact')">contact</button>
    </div>

    <!-- 1. แท็บ Home (หน้าเดียวเรียงลงมาตามรูปภาพเป๊ะๆ) -->
    <div class="tab-section active" id="sec-home">
      
      <!-- การ์ดโปรไฟล์ร้าน -->
      <div class="store-card">
        <div class="banner-wrap">
          <img id="storeBanner" src="" alt="Banner">
        </div>
        <div class="profile-wrap">
          <img id="storeProfile" src="" alt="Profile">
        </div>
        <h1 class="store-name" id="storeNameText">luniecha ♡</h1>
        <p class="store-bio" id="storeBioText">ยินดีต้อนรับเข้าสู่ร้าน luniecha ♡
ร้านเราเปิด 24 ชั่วโมง พร้อมตอบตลอดนะคะ
Appre Netflix YouTube
Instagram Stk สอบถามได้ค่ะ</p>
      </div>

      <!-- การ์ดไฮไลท์ -->
      <div class="card-box">
        <div class="box-title" id="hlBoxTitle">highlights♡ (0 รายการ)</div>
        <div class="highlights-wrap" id="highlightsList"></div>
      </div>

      <!-- การ์ดรีวิว + ฟอร์มเขียนรีวิวด้านล่าง -->
      <div class="card-box">
        <div class="box-title">review luniecha ♡</div>

        <!-- รายการรีวิวที่ลูกค้าส่งเข้ามา -->
        <div class="reviews-list" id="reviewsContainer">
          <p style="text-align:center; color:#b09ba0; font-size:12.5px;">กำลังโหลดรีวิว...</p>
        </div>

        <div class="review-form-divider"></div>

        <!-- ตัวเลือกดาว -->
        <div class="form-stars-select">
          <button type="button" class="star-btn active" onclick="chooseStar(1)">★</button>
          <button type="button" class="star-btn active" onclick="chooseStar(2)">★</button>
          <button type="button" class="star-btn active" onclick="chooseStar(3)">★</button>
          <button type="button" class="star-btn active" onclick="chooseStar(4)">★</button>
          <button type="button" class="star-btn active" onclick="chooseStar(5)">★</button>
        </div>

        <!-- ช่องกรอกชื่อ -->
        <input type="text" id="custNameInput" class="custom-input" placeholder="สามารถกรอกชื่อตัวเองได้เลยนะคะ">

        <!-- ช่องกรอกข้อความรีวิว -->
        <input type="text" id="custCommentInput" class="custom-input" placeholder="รีวิวร้านเค้าได้ตามความรู้สึกเลยนะคะ ♡">

        <!-- ปุ่มส่งรีวิว -->
        <button type="button" class="btn-submit-review" id="sendReviewBtn" onclick="submitReviewInline()">
          ส่งรีวิว ♡

    </div>

    <!-- 2. แท็บ contact (2 กล่องติดต่อ LINE) -->
    <div class="tab-section" id="sec-contact">
      
      <!-- กล่อง line officials -->
      <a href="https://lin.ee/SwUd9RB" target="_blank" class="contact-card-link">
        <div class="contact-title">line officials</div>
      </a>

      <!-- กล่อง line ( ส่วนตัว ) -->
      <a href="https://line.me/ti/p/caSKr8HbF6" target="_blank" class="contact-card-link">
        <div class="contact-title">line ( ส่วนตัว )</div>
        <div class="contact-sub">ทักมาซ้ำๆนะคะ ข้อความไม่ขึ้น</div>
      </a>

    </div>

  </div>

  <!-- Story Modal ดูรูปไฮไลท์แบบเต็มจอ -->
  <div class="story-modal" id="storyModal">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-header">
      <span id="storyHeaderName" style="font-size:14px; font-weight:700;">Highlight</span>
      <button class="story-close-btn" onclick="closeStory()">✕</button>
    </div>
    <div class="story-image-container">
      <img id="storyImage" class="story-image" src="" alt="Story">
      <div class="story-tap-left" id="storyTapLeft"></div>
      <div class="story-tap-right" id="storyTapRight"></div>
    </div>
  </div>

  <script>
    // เชื่อมต่อฐานข้อมูลเดิม
    const DB_SITE = "jianing_site_data";
    const DB_HL = "jianing_site_highlights";
    const DB_REVIEWS = "jianing_site_reviews";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const music = document.getElementById('bgMusic');
    function playMusic() {
      if (music.paused) music.play().catch(() => {});
    }
    window.addEventListener('load', playMusic);
    document.addEventListener('DOMContentLoaded', playMusic);
    ['touchstart', 'click'].forEach(evt => {
      document.addEventListener(evt, function trig() {
        playMusic();
        document.removeEventListener(evt, trig);
      }, { passive: true });
    });

    // ฟังก์ชันสลับแท็บ Home / contact
    function switchPage(page) {
      document.getElementById('btn-home').classList.remove('active');
      document.getElementById('btn-contact').classList.remove('active');
      document.getElementById('sec-home').classList.remove('active');
      document.getElementById('sec-contact').classList.remove('active');

      if (page === 'home') {
        document.getElementById('btn-home').classList.add('active');
        document.getElementById('sec-home').classList.add('active');
      } else {
        document.getElementById('btn-contact').classList.add('active');
        document.getElementById('sec-contact').classList.add('active');
      }
    }

    // 1. ดึงข้อมูลร้าน
    function applySiteData(d) {
      if (!d) return;
      if (d.banner) document.getElementById('storeBanner').src = d.banner;
      if (d.profile) document.getElementById('storeProfile').src = d.profile;
      if (d.storeName) document.getElementById('storeNameText').textContent = d.storeName;
      if (d.storeBio) document.getElementById('storeBioText').textContent = d.storeBio;
      if (d.musicUrl && music.src !== d.musicUrl) {
        music.src = d.musicUrl;
        playMusic();
      }
    }

    try {
      const cached = localStorage.getItem('jianing_cached_data');
      if (cached) applySiteData(JSON.parse(cached));
    } catch (e) {}

    db.collection(DB_SITE).doc("content").onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        localStorage.setItem('jianing_cached_data', JSON.stringify(d));
        applySiteData(d);
      }
    });

    // 2. ดึงไฮไลท์
    let highlightsData = [];
    db.collection(DB_HL).orderBy("order", "asc").onSnapshot(async snap => {
      highlightsData = [];
      for (const doc of snap.docs) {
        const hl = { id: doc.id, ...doc.data() };
        const slidesSnap = await db.collection(DB_HL).doc(doc.id).collection("slides").orderBy("idx", "asc").get();
        if (!slidesSnap.empty) {
          hl.images = slidesSnap.docs.map(s => s.data().url);
        } else if (!hl.images) {
          hl.images = [];
        }
        highlightsData.push(hl);
      }
      renderHighlights(highlightsData);
    });

    function renderHighlights(hl) {
      const bar = document.getElementById('highlightsList');
      const titleBox = document.getElementById('hlBoxTitle');
      titleBox.textContent = `highlights♡ (${hl.length} รายการ)`;
      bar.innerHTML = '';

      if (!hl || hl.length === 0) {
        bar.innerHTML = '<span style="font-size:12px; color:#b09ba0; padding:6px;">ยังไม่มีไฮไลท์</span>';
        return;
      }

      hl.forEach((item, idx) => {
        const cover = item.cover || (item.images && item.images[0]) || "";
        const div = document.createElement('div');
        div.className = 'hl-item';
        div.onclick = () => openStory(idx);
        div.innerHTML = `
          <div class="hl-ring"><img src="${cover}" alt="HL"></div>
          <div class="hl-label">${item.title || '♡'}</div>
        `;
        bar.appendChild(div);
      });
    }

    // Story System
    let activeHlIdx = 0, activeSlideIdx = 0, slideTimer = null;
    function openStory(idx) {
      activeHlIdx = idx; activeSlideIdx = 0;
      const hl = highlightsData[idx];
      if (!hl || !hl.images || !hl.images.length) {
        alert("ยังไม่มีรูปในไฮไลท์นี้ค่ะ ♡");
        return;
      }
      document.getElementById('storyHeaderName').textContent = hl.title || 'Highlight';
      const bars = document.getElementById('storyBars');
      bars.innerHTML = '';
      hl.images.forEach((_, i) => {
        const b = document.createElement('div');
        b.className = 'story-bar';
        b.innerHTML = `<div class="story-bar-fill" id="sb-${i}"></div>`;
        bars.appendChild(b);
      });
      document.getElementById('storyModal').classList.add('active');
      showStorySlide();
    }

    function showStorySlide() {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      document.getElementById('storyImage').src = hl.images[activeSlideIdx];
      hl.images.forEach((_, i) => {
        const fill = document.getElementById(`sb-${i}`);
        if (!fill) return;
        if (i < activeSlideIdx) fill.style.width = '100%';
        else if (i === activeSlideIdx) {
          fill.style.width = '0%';
          setTimeout(() => { fill.style.width = '100%'; }, 50);
        } else fill.style.width = '0%';
      });
      slideTimer = setTimeout(nextStorySlide, 4500);
    }

    function nextStorySlide() {
      clearTimeout(slideTimer);
      const hl = highlightsData[activeHlIdx];
      if (activeSlideIdx < hl.images.length - 1) {
        activeSlideIdx++; showStorySlide();
      } else { closeStory(); }
    }
    function prevStorySlide() {
      clearTimeout(slideTimer);
      if (activeSlideIdx > 0) {
        activeSlideIdx--; showStorySlide();
      }
    }
    function closeStory() {
      clearTimeout(slideTimer);
      document.getElementById('storyModal').classList.remove('active');
    }
    document.getElementById('storyTapRight').onclick = nextStorySlide;
    document.getElementById('storyTapLeft').onclick = prevStorySlide;

    // 3. ระบบรีวิว & ส่งรีวิวแบบในหน้าจอ
    let selectedRating = 5;
    function chooseStar(star) {
      selectedRating = star;
      document.querySelectorAll('.star-btn').forEach((b, i) => {
        if (i < star) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    async function submitReviewInline() {
      const name = document.getElementById('custNameInput').value.trim();
      const feedback = document.getElementById('custCommentInput').value.trim();
      const btn = document.getElementById('sendReviewBtn');

      if (!name || !feedback) {
        alert('กรุณากรอกชื่อและข้อความรีวิวก่อนกดส่งนะคะ ♡');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังส่งรีวิว... ⏳';

      try {
        const now = new Date();
        const dateStr = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

        await db.collection(DB_REVIEWS).add({
          name: name,
          feedback: feedback,
          stars: selectedRating,
          dateStr: dateStr,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('custNameInput').value = '';
        document.getElementById('custCommentInput').value = '';
        chooseStar(5);
        alert('ส่งรีวิวเรียบร้อย ขอบคุณมากนะคะ ♡');
      } catch (err) {
        alert('ส่งรีวิวไม่สำเร็จ ลองใหม่อีกครั้งนะคะ');
      } finally {
        btn.disabled = false;
        btn.textContent = 'ส่งรีวิว ♡';
      }
    }

    // ดึงรีวิวเดิมมาแสดง
    db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const container = document.getElementById('reviewsContainer');
      if (snapshot.empty) {
        container.innerHTML = '<p style="text-align:center; color:#b09ba0; font-size:12.5px;">ยังไม่มีรีวิว มารีวิวคนแรกได้เลยนะคะ ♡</p>';
        return;
      }
      let html = '';
      snapshot.forEach(doc => {
        const r = doc.data();
        html += `
          <div class="review-bubble">
            <div class="rev-head">
              <span class="rev-name">${r.name}</span>
              <span class="rev-stars">${'★'.repeat(r.stars || 5)}</span>
            </div>
            <div class="rev-text">${r.feedback}</div>
            <div class="rev-date">${r.dateStr || ''}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
